{% extends "base.html" %}{% block page_title %}Audit Log{% endblock %}{% block content %}
<div class="card"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Result</th></tr></thead><tbody>
{% for x in rows %}<tr><td>{{ x.created_at }}</td><td>{{ x.user_id or "-" }}</td><td>{{ x.action }}</td><td>{{ x.entity_type }} {{ x.entity_id }}</td><td><span class="badge">{{ x.result }}</span></td></tr>{% else %}<tr><td colspan="5" class="empty">Няма audit events.</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}

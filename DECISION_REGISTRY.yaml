schema_version: 3
registry: M99_DECISION_REGISTRY
source_of_truth: README_v11.md
updated_at: '2026-08-27'
anti_loop_rule: DECIDED != IMPLEMENTED
status_values:
- DECIDED
- DECIDED_TESTED
- IMPLEMENTED
- TESTED
- PLANNED
- OPEN
- DEFERRED
- SUPERSEDED
decisions:
- id: GOV-001
  area: governance
  status: DECIDED
  statement: M99 is the Single Source of Truth for canonical identity and verified knowledge.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: GOV-002
  area: governance
  status: DECIDED
  statement: 'Knowledge First: verified knowledge precedes content, publishing and downstream automation.'
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: GOV-003
  area: governance
  status: DECIDED
  statement: 'AI Native, not AI Invented: AI must not invent technical or commercial facts.'
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: GOV-004
  area: governance
  status: DECIDED
  statement: Before new architecture proposals, consult Decision Registry, Current Context, Project State, latest README,
    relevant ADR and tests/history.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: GOV-005
  area: governance
  status: DECIDED
  statement: A failed implementation attempt does not reopen a DECIDED rule.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: GOV-006
  area: governance
  status: DECIDED
  statement: README remains the master human-readable constitution and machine-readable governance files are mandatory project
    memory.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CORE-001
  area: core
  status: DECIDED
  statement: 'No Duplicate Data: reusable canonical facts/entities are stored once and mapped, not duplicated per channel.'
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CORE-002
  area: core
  status: DECIDED
  statement: Historical observations are preserved.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CORE-003
  area: core
  status: DECIDED
  statement: Market and Channel are separate concepts.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CORE-004
  area: core
  status: DECIDED
  statement: Removing a product from a channel must not destroy accumulated M99 knowledge.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: EVID-001
  area: evidence
  status: DECIDED
  statement: Important facts preserve provenance including source, observation/verification time and conflict/reviewer context
    where available.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: EVID-002
  area: evidence
  status: DECIDED
  statement: Evidence priority is exact manufacturer, official documentation/certificates, validated B2B, exact supplier,
    verified internal data, operator, then AI over verified data.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: EVID-003
  area: evidence
  status: DECIDED
  statement: Observation is evidence and does not automatically become canonical truth.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: UX-001
  area: operator_ux
  status: DECIDED
  statement: Operator-first UX.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: UX-002
  area: operator_ux
  status: DECIDED
  statement: One-decision-per-screen is the target operator UX.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: UX-003
  area: operator_ux
  status: DECIDED
  statement: Operators must not need Python, PowerShell, API, HTTP, JSON, XML, SQL, credentials or platform internals.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: UX-004
  area: operator_ux
  status: DECIDED
  statement: The primary operator workflow is generalized Add Products, not a dedicated Add to m99.eu screen.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: UX-005
  area: operator_ux
  status: DECIDED
  statement: Primary Supplier selection UX must not require URL copy/paste or BAT/Python scripts.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ID-001
  area: identity
  status: DECIDED_TESTED
  statement: M99 canonical identity is independent from external IDs.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ID-002
  area: identity
  status: DECIDED_TESTED
  statement: M99 Reference format is M99- followed by digits only.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ID-003
  area: identity
  status: DECIDED
  statement: Assigned M99 identity is never reused for another ProductGroup.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ID-004
  area: identity
  status: DECIDED
  statement: Identity Before Content.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ID-005
  area: identity
  status: DECIDED
  statement: Identity resolution states are NEW, EXISTING, AMBIGUOUS and UNRESOLVED; AMBIGUOUS requires human decision.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PG-001
  area: product_group
  status: DECIDED
  statement: ProductGroup lifecycle is draft -> active -> paused -> retired.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PG-002
  area: product_group
  status: DECIDED
  statement: Hard DELETE requires explicit human approval and typed DELETE confirmation.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ORG-001
  area: organization
  status: DECIDED
  statement: Supplier and Manufacturer are Organization roles; one Organization may hold both roles.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ORG-002
  area: organization
  status: DECIDED
  statement: New Supplier, Manufacturer and Brand proposals require Super Admin approval before general operator availability.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ORG-003
  area: organization
  status: DECIDED
  statement: A canonical product may have multiple verified supplier/manufacturer mappings.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: BRAND-001
  area: brand
  status: DECIDED
  statement: Brand is a separate canonical object linked to owner/manufacturer organizations and official sources.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: B2B-001
  area: b2b
  status: DECIDED
  statement: B2B portals belong to Organizations and declare connector capabilities.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SRC-001
  area: supplier_source
  status: DECIDED
  statement: An Organization may have multiple SupplierSources such as public website, B2B, API, feeds, catalogues, price
    lists and stock feeds.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SRC-002
  area: supplier_source
  status: DECIDED
  statement: SupplierSources declare explicit capabilities including identity, technical facts, images, price, availability,
    variants and stock where supported.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SRC-003
  area: supplier_source
  status: DECIDED
  statement: The running M99 runtime may use controlled read-only live SupplierSource access; SAFE installers do not crawl
    suppliers automatically.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SRC-004
  area: supplier_source
  status: DECIDED
  statement: Supplier-specific adapters implement one common Live Supplier Connector contract so the operator UI remains supplier-independent.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMP-001
  area: import
  status: DECIDED
  statement: Direct Supplier Selection is the target UX.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMP-002
  area: import
  status: DECIDED
  statement: Selection supports one or many products, one or many categories, and all products where the source supports it.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMP-003
  area: import
  status: DECIDED
  statement: Every new-product import is an auditable ImportJob.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMP-004
  area: import
  status: DECIDED
  statement: WRITE_TARGETS = REQUESTED intersect AUTHORIZED intersect READY.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMP-005
  area: import
  status: DECIDED
  statement: Import presets simplify workflows but never grant permissions not already held by the user.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CH-001
  area: channels
  status: DECIDED
  statement: Operators may choose one or more authorized target channels/ERP destinations for NEW PRODUCT IMPORT.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CH-002
  area: channels
  status: DECIDED
  statement: m99.eu is one target channel, not the central Add Product workflow.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CH-003
  area: channels
  status: DECIDED
  statement: NOT_SELECTED and BLOCKED are distinct target states.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-001
  area: publishing
  status: DECIDED
  statement: New products publish TEST/Draft first.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-002
  area: publishing
  status: DECIDED
  statement: TEST category is resolved live.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-003
  area: publishing
  status: DECIDED
  statement: Final category is operator-owned.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-004
  area: publishing
  status: DECIDED
  statement: CREATE and UPDATE are separate contracts.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-005
  area: publishing
  status: DECIDED
  statement: Duplicate guard runs before CREATE.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-006
  area: publishing
  status: DECIDED
  statement: Readback is mandatory after write.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-007
  area: publishing
  status: DECIDED
  statement: HTTP 200/201 does not equal Product Quality PASS.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-008
  area: publishing
  status: DECIDED
  statement: Activation requires authorization.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PUB-009
  area: publishing
  status: DECIDED
  statement: Front Office verification is required where applicable after channel writes.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CNT-001
  area: content
  status: DECIDED
  statement: Content is channel/market/language aware and based on verified facts.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CNT-002
  area: content
  status: DECIDED
  statement: Every required content field is reviewed per language; Image and ALT are reviewed together.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CNT-003
  area: content
  status: DECIDED
  statement: Supplier prose is not copied verbatim; prose/SEO is adapted per channel and language.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: LANG-001
  area: language
  status: DECIDED
  statement: Language Registry is dynamic and channel language IDs are discovered live rather than assumed.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMG-001
  area: images
  status: DECIDED
  statement: Image source priority is official manufacturer, then verified supplier; another M99 channel is not the master
    image source by default.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: IMG-002
  area: images
  status: DECIDED
  statement: Image pipeline is discover -> verify -> download -> relevance -> dedupe -> resize -> WebP -> localized ALT ->
    operator review -> upload -> readback.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: VAR-001
  area: variants
  status: DECIDED
  statement: A variational product must have exactly one default combination.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: VAR-002
  area: variants
  status: DECIDED
  statement: Visible size is not stock.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: VAR-003
  area: variants
  status: DECIDED
  statement: Dolibarr/M99 stock is variant-aware.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRC-001
  area: pricing
  status: DECIDED
  statement: Target selling price is gross VAT-included customer price.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRC-002
  area: pricing
  status: DECIDED
  statement: VAT is channel/market configuration and is not a universal hardcoded constant.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRC-003
  area: pricing
  status: DECIDED
  statement: Supplier price changes flow through approved pricing rule, currency, VAT, target gross, platform representation,
    write, readback and Front Office verification.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-001
  area: sync
  status: DECIDED
  statement: Existing products sync daily and NO_CHANGE means NO_WRITE.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-002
  area: sync
  status: DECIDED
  statement: Daily Existing Product Sync is separate from New Product Import and is not controlled by new-product target selection.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-003
  area: sync
  status: DECIDED
  statement: Daily Sync operates on canonical products with verified supplier/source mappings.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-004
  area: sync
  status: DECIDED
  statement: Daily Sync checks price, availability, variants/sizes, product changes and discontinuation.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-005
  area: sync
  status: DECIDED
  statement: Daily Sync updates only already-existing allowed channel/ERP mappings and never auto-creates a missing channel
    product.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-006
  area: sync
  status: DECIDED
  statement: Daily Sync change states include NO_CHANGE, PRICE_CHANGED, AVAILABILITY_CHANGED, VARIANT_AVAILABILITY_CHANGED,
    PRODUCT_CHANGED, SUPPLIER_DISCONTINUED and VERIFICATION_FAILED.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-007
  area: sync
  status: DECIDED
  statement: VERIFICATION_FAILED is not interpreted as zero stock or OUT_OF_STOCK; last verified observation is preserved.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SYNC-008
  area: sync
  status: DECIDED
  statement: Daily Sync must expose business metrics including checked products, changes, writes, NO_CHANGE, blocked and errors.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: OBS-001
  area: observation
  status: DECIDED
  statement: Supplier observations preserve source/product/variant mapping, timestamps, price/currency, availability, changed
    fields and verification/provenance state.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: OBS-002
  area: observation
  status: DECIDED
  statement: Historical supplier observations are retained to explain commercial changes over time.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRES-001
  area: product_presence
  status: DECIDED
  statement: Presence is not Stock.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRES-002
  area: product_presence
  status: DECIDED
  statement: 'M99 provides bidirectional Product Presence reporting: Product -> Channels and Channel -> Products, including
    missing mappings.'
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRES-003
  area: product_presence
  status: DECIDED
  statement: Presence states include NOT_PRESENT, PRESENT_DRAFT, PRESENT_TEST, PRESENT_ACTIVE, PRESENT_PAUSED, PRESENT_RETIRED,
    PRESENT_LAST_VERIFIED, UNKNOWN and VERIFICATION_FAILED.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: PRES-004
  area: product_presence
  status: DECIDED
  statement: Product Presence stores external IDs, publication state, price, last verification/sync and errors where available.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ERP-001
  area: erp
  status: DECIDED
  statement: M99 owns canonical identity/knowledge; Dolibarr is the operational ERP/CRM/warehouse representation.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ERP-002
  area: erp
  status: DECIDED
  statement: M99-owned physical stock increases through supplier reception and decreases through customer shipment.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: ERP-003
  area: erp
  status: DECIDED
  statement: Dolibarr uses a distinct target adapter/payload and is not treated as another website.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: WH-001
  area: warehouse
  status: DECIDED
  statement: Approved Supplier/Manufacturer Organizations may have linked EXTERNAL availability warehouses in Dolibarr named
    after the organization.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: WH-002
  area: warehouse
  status: DECIDED
  statement: Warehouse ownership/type distinguishes M99_PHYSICAL, SUPPLIER_EXTERNAL and MANUFACTURER_EXTERNAL.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: WH-003
  area: warehouse
  status: DECIDED
  statement: Supplier/manufacturer external warehouse availability is never interpreted automatically as M99-owned physical
    stock.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: WH-004
  area: warehouse
  status: DECIDED
  statement: External warehouse availability is variant-aware where reliable source data is variant-level.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: WH-005
  area: warehouse
  status: DECIDED
  statement: Numeric external warehouse quantity is written only when the source provides a reliable exact quantity; status-only
    availability never receives invented numeric stock.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: WH-006
  area: warehouse
  status: DECIDED
  statement: Supplier availability states may represent exact quantity, in stock, low stock, out of stock, on request, unknown
    or verification failed without fabricating quantities.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: REV-001
  area: revision
  status: DECIDED
  statement: Existing Product Content Revision is a separate operational class from New Product Import and Daily Sync.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: REV-002
  area: revision
  status: DECIDED
  statement: Existing approved Product Name and URL/slug are normally locked during content revision.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: REV-003
  area: revision
  status: DECIDED
  statement: Existing Category Name, URL/slug and structural identity fields are normally locked during content revision.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: REV-004
  area: revision
  status: DECIDED
  statement: Product and Category content may be revised without reopening structural identity by default.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: QG-001
  area: quality
  status: DECIDED
  statement: A numeric quality score can never override a failed critical Product Quality Gate.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SEC-001
  area: security
  status: DECIDED
  statement: Operators never see channel/B2B credentials and secrets are never committed to Git, logged or exposed in screenshots.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SEC-002
  area: security
  status: DECIDED
  statement: Permissions are enforced server-side, not only by menu visibility.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: SEC-003
  area: security
  status: DECIDED
  statement: Authentication direction includes secure password hashing, session management, timeout, failed-login protection,
    reset workflow and login/logout audit.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: AUDIT-001
  area: audit
  status: DECIDED
  statement: Central Super Admin logs include Audit, System, Supplier/B2B & Channel Integration and Security logs.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: AUDIT-002
  area: audit
  status: DECIDED
  statement: Minimum operational log context includes timestamp, severity, user, module, operation, entity, supplier/channel,
    job_id, result, message and correlation_id.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: MIG-001
  area: migration
  status: DECIDED
  statement: MoneyWork and legacy sites are reconciliation sources, not canonical masters.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: MIG-002
  area: migration
  status: DECIDED
  statement: Preferred migration flow is Inspect -> Normalize -> Deduplicate -> Identity Map -> Supplier/Customer Map -> Dry
    Run -> Import -> Reconcile -> Audit.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: CRM-001
  area: crm
  status: DECIDED
  statement: CRM foundation flow is First call -> Offer -> Second call.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: OPS-001
  area: operations
  status: DECIDED
  statement: 'Operational classes remain distinct: New Product Import, Existing Product Daily Sync, Manual/Exceptional Repair,
    Existing Product Content Revision, Existing Category Content Revision and Knowledge/Evidence Acquisition.'
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: DEV-001
  area: development
  status: DECIDED_TESTED
  statement: SAFE development uses clean baseline, controlled patch, compile, dedicated tests, full regression, exact scope
    review, explicit COMMIT and no automatic Push.
  source: README_v9.md
  reopen_policy: explicit_superseding_decision_only
- id: GOV-V10-001
  area: governance
  status: DECIDED_TESTED
  statement: M99 v0.7.3 Phase 4.5 Revision 29R3.2R2 is the frozen tested runtime baseline and is preserved until an explicit
    superseding decision.
  source: README_v10.md#40
  implementation_status: TESTED
  reopen_policy: explicit_superseding_decision_only
- id: UX-V10-001
  area: operator_ux
  status: DECIDED_TESTED
  statement: Supplier Browser starts with zero products selected by default.
  source: README_v10.md#40
  implementation_status: IMPLEMENTED_TESTED
  reopen_policy: explicit_superseding_decision_only
- id: TEST-V10-001
  area: testing
  status: DECIDED
  statement: First live validation of a new connector or behavior uses exactly one product before batch use.
  source: README_v10.md#40
  implementation_status: OPERATIONAL_RULE
  reopen_policy: explicit_superseding_decision_only

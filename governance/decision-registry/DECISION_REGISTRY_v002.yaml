    source: README_v9.md

  - id: PRES-004
    area: product_presence
    status: DECIDED
    statement: "Product Presence UI supports FAST last-verified mode and LIVE VERIFY mode."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: PRES-005
    area: product_presence
    status: DECIDED
    statement: "Temporary target verification failure does not convert previously verified PRESENT to NOT_PRESENT; last verified presence is retained with failure state."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: UI-005
    area: operator_ux
    status: DECIDED
    statement: "Unified Product Availability view shows WHERE IT IS SOLD, M99-owned physical stock and supplier/manufacturer external availability without mixing their semantics."

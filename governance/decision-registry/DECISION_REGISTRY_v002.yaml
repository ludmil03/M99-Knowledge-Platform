    source: README_v9.md

  - id: IMG-002
    area: images
    status: DECIDED
    statement: "Image pipeline is Discover -> Verify -> Download -> Relevance Check -> Dedupe -> resize ~1200-1400 -> WebP -> localized ALT -> Operator Review -> Upload -> Association -> Readback."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md


  - id: SRC-003
    area: supplier_sources
    status: DECIDED
    statement: "The installer does not crawl external suppliers, while authorized M99 runtime may perform controlled read-only access to configured SupplierSource records."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: SRC-004
    area: supplier_sources
    status: DECIDED
    statement: "The same Supplier Connector abstraction supports both operator browsing and scheduled existing-product observation/sync."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: SRC-005
    area: supplier_sources
    status: DECIDED
    statement: "STENSO is the first planned reference live connector, but the connector contract must remain supplier-agnostic."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md


    source: README_v9.md

  - id: AVAIL-002
    area: availability
    status: DECIDED
    statement: "M99 must not invent supplier quantity when a source exposes only qualitative availability."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: AVAIL-003
    area: availability
    status: DECIDED
    statement: "Supplier/manufacturer external availability is variant-aware when the source exposes variant/size availability."

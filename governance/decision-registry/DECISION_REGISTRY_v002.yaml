    source: README_v9.md

  - id: REV-002
    area: content_revision
    status: DECIDED
    statement: "Existing Category Name, URL/slug, M99 Category ID, Channel Category ID and parent relationship are locked during normal content revision."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md


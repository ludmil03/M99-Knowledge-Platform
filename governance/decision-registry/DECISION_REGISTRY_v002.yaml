    source: README_v9.md

  - id: SYNC-004
    area: sync
    status: DECIDED
    statement: "Minimum daily change states are NO_CHANGE, PRICE_CHANGED, AVAILABILITY_CHANGED, VARIANT_AVAILABILITY_CHANGED, PRODUCT_CHANGED, SUPPLIER_DISCONTINUED and VERIFICATION_FAILED."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: SYNC-005
    area: sync
    status: DECIDED
    statement: "A verification failure must not be converted into zero quantity, OUT_OF_STOCK, NOT_PRESENT or discontinued; preserve the last verified state and record the failure."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: SYNC-006
    area: sync
    status: DECIDED
    statement: "Daily Sync writes only changed, policy-owned fields and avoids unnecessary writes."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: SYNC-007
    area: sync
    status: DECIDED
    statement: "Daily Sync has a business-visible dashboard showing last run, checked products, supplier checks, price/availability/variant changes, channel/Dolibarr writes, NO_CHANGE, blocked and errors."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: PRC-002
    area: pricing
    status: DECIDED
    statement: "Price sync pipeline is supplier price -> approved pricing rule -> market currency -> channel/market VAT -> target gross -> platform NET if required -> API write -> readback -> Front Office gross-price verification."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md


    source: README_v9.md

  - id: AUDIT-001
    area: audit
    status: DECIDED
    statement: "Central audit/integration logs use structured fields including timestamp, actor, module, operation, entity, supplier/channel, job/sync ID, result, message and correlation ID, without secret values."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: OPS-001
    area: operations
    status: DECIDED
    statement: "NEW PRODUCT IMPORT, EXISTING PRODUCT DAILY SYNC, MANUAL/EXCEPTIONAL REPAIR, EXISTING PRODUCT CONTENT REVISION, EXISTING CATEGORY CONTENT REVISION and KNOWLEDGE/EVIDENCE ACQUISITION are distinct operational classes."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: OPS-002
    area: operations
    status: DECIDED
    statement: "Manual/exceptional repair is exact-target and exact-field scoped, requires explicit confirmation and mandatory readback, and must avoid broad side effects."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md


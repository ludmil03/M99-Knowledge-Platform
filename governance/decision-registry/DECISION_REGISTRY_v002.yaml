    source: README_v9.md

  - id: PRES-001
    area: product_presence
    status: DECIDED
    statement: "Presence is not Stock."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: ERP-001
    area: erp
    status: DECIDED
    statement: "M99 owns canonical identity/knowledge; Dolibarr is the operational ERP/CRM/warehouse representation."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md


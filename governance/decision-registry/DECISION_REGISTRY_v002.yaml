    source: README_v9.md

  - id: WH-003
    area: dolibarr_warehouse
    status: DECIDED
    statement: "Quantity in a supplier/manufacturer external warehouse represents latest verified external availability and never M99-owned physical stock."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: WH-004
    area: dolibarr_warehouse
    status: DECIDED
    statement: "Exact external warehouse quantity is written only when the source exposes a verified exact quantity; qualitative availability is stored as status without fabricated numbers."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: WH-005
    area: dolibarr_warehouse
    status: DECIDED
    statement: "External supplier/manufacturer warehouse availability is variant-aware."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: WH-006
    area: dolibarr_warehouse
    status: DECIDED
    statement: "On supplier verification failure, the previous verified external availability is retained and marked failed rather than automatically zeroed."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: MULTISUP-001
    area: supplier_mapping
    status: DECIDED
    statement: "One canonical M99 product may have multiple SupplierMappings/ManufacturerMappings; supplier mapping is not canonical identity."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: PRES-002
    area: product_presence
    status: DECIDED
    statement: "M99 provides bidirectional Product -> Channels/ERP and Channel -> Products presence reports, including missing mappings."

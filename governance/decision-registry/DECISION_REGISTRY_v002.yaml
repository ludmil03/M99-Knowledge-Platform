    source: README_v9.md

  - id: WH-001
    area: dolibarr_warehouse
    status: DECIDED
    statement: "Approved Supplier/Manufacturer Organizations may have dedicated external availability warehouses in Dolibarr."
    reopen_policy: explicit_superseding_decision_only
    source: README_v9.md

  - id: WH-002
    area: dolibarr_warehouse
    status: DECIDED
    statement: "Dolibarr warehouse ownership/type distinguishes M99_PHYSICAL from SUPPLIER_EXTERNAL and MANUFACTURER_EXTERNAL."

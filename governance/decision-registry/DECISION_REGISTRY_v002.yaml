    source: README_v9.md

  - id: PRES-003
    area: product_presence
    status: DECIDED
    statement: "Product Presence mappings retain external IDs, URL, publication state, price/currency, stock representation, last verified, last sync, sync ownership, readback/front-office state and errors."
